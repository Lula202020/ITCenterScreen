<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flappy Bird</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Arial}
    .shell{display:flex;flex-direction:column;height:100%}
    .head{padding:8px 12px;background:#111;color:#fff;display:flex;align-items:center;gap:8px}
    .head button{margin-left:auto}
    .info{font-size:13px;opacity:0.9}
    .frame-wrap{flex:1;background:#fff}
    iframe{width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div class="shell">
    <div class="head">
      <div class="info" id="info">Loading...</div>
      <button id="openInNew">Open in new tab</button>
    </div>
    <div class="frame-wrap">
      <iframe id="siteFrame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const siteUrl = params.get('url');

    const info = document.getElementById('info');
    const iframe = document.getElementById('siteFrame');
    const openInNew = document.getElementById('openInNew');

    function setInfo(text) {
      info.textContent = text;
    }

    if (!siteUrl) {
      setInfo('No URL provided');
      iframe.srcdoc = '<p style="padding:16px">No URL provided.</p>';
      console.warn('popup: no url param');
    } else {
      setInfo(siteUrl);
      try {
        iframe.src = siteUrl;
      } catch (e) {
        iframe.srcdoc = `<p style="padding:16px">Failed to load \"${siteUrl}\"</p>`;
      }

      // No console message executed — message parameter removed for safety.
    }

    openInNew.addEventListener('click', () => {
      if (siteUrl) window.open(siteUrl, '_blank');
    });
  </script>
</body>
</html>
